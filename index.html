<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Maximo</title>
    <link rel="stylesheet" href="/src/render/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- The grid itself is drawn by PixiJS; the chrome around it is DOM, which
           keeps text legible, responsive and easy to restyle. -->
      <div id="stage"></div>

      <header id="hud-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">◆</span>
          <span class="brand-name">Maximo</span>
        </div>

        <div id="levels" class="levels" aria-label="Gem levels"></div>

        <div class="readouts">
          <div class="readout" id="readout-streak">
            <span class="readout-label">Streak</span>
            <span class="readout-value" id="value-streak">0</span>
          </div>
          <div class="readout" id="readout-accuracy">
            <span class="readout-label">Correct</span>
            <span class="readout-value" id="value-accuracy">—</span>
          </div>
        </div>
      </header>

      <div id="meter-wrap">
        <div class="meter-label">Collection</div>
        <div class="meter-track"><div class="meter-fill" id="meter-fill"></div></div>
        <div class="meter-releases" id="meter-releases"></div>
      </div>

      <div id="banner-layer" aria-live="polite"></div>

      <footer id="hud-bottom">
        <div class="money">
          <div class="readout">
            <span class="readout-label">Balance</span>
            <span class="readout-value" id="value-balance">1,000.00</span>
          </div>
          <div class="readout">
            <span class="readout-label">Win</span>
            <span class="readout-value win" id="value-win">0.00</span>
          </div>
        </div>

        <div class="controls">
          <div class="bet">
            <button type="button" id="bet-down" aria-label="Decrease bet">−</button>
            <div class="bet-value">
              <span class="readout-label">Bet</span>
              <span class="readout-value" id="value-bet">1.00</span>
            </div>
            <button type="button" id="bet-up" aria-label="Increase bet">+</button>
          </div>

          <button type="button" id="spin" class="spin">Spin</button>

          <div class="extras">
            <button type="button" id="turbo" class="toggle" aria-pressed="false">Turbo</button>
            <button type="button" id="auto" class="toggle" aria-pressed="false">Auto</button>
            <button type="button" id="buy">Buy</button>
            <button type="button" id="info">Info</button>
          </div>
        </div>
      </footer>

      <!-- Overlays -->
      <div id="quiz-layer" class="overlay" hidden></div>
      <div id="modal-layer" class="overlay" hidden></div>
      <div id="debug-layer"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
