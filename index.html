<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Max Birds</title>
    <link rel="stylesheet" href="/src/render/ui/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Painted backdrop from the art pack; the board floats over it. -->
      <div id="backdrop"></div>
      <div id="backdrop-shade"></div>

      <header id="hud-top">
        <img id="title-emblem" alt="Max Birds" />

        <div id="levels" class="levels" aria-label="Gem levels"></div>

        <div class="readouts">
          <div class="readout">
            <span class="readout-label">Streak</span>
            <span class="readout-value" id="value-streak">0</span>
          </div>
          <div class="readout">
            <span class="readout-label">Correct</span>
            <span class="readout-value" id="value-accuracy">—</span>
          </div>
        </div>
      </header>

      <div id="playfield">
        <!-- The rival waits in its cage until a key sets it loose. -->
        <div id="cage" aria-label="The rival, caged">
          <img id="cage-bird" alt="" />
          <img id="cage-bars" alt="" />
          <img id="cage-lock" alt="" />
        </div>

        <div id="stage"></div>

        <div id="banner-layer" aria-live="polite"></div>
      </div>

      <footer id="hud-bottom">
        <div class="money">
          <div class="readout">
            <span class="readout-label">Balance</span>
            <span class="readout-value" id="value-balance">1,000.00</span>
          </div>
          <div class="readout">
            <span class="readout-label">Win</span>
            <span class="readout-value win" id="value-win">0.00</span>
          </div>
        </div>

        <div class="controls">
          <button type="button" id="buy" class="rail">Buy</button>

          <div class="bet">
            <button type="button" id="bet-down" aria-label="Decrease bet">−</button>
            <div class="bet-value">
              <span class="readout-label">Bet</span>
              <span class="readout-value" id="value-bet">1.00</span>
            </div>
            <button type="button" id="bet-up" aria-label="Increase bet">+</button>
          </div>

          <button type="button" id="spin" class="spin">Spin</button>

          <div class="extras">
            <button type="button" id="turbo" class="toggle" aria-pressed="false">Turbo</button>
            <button type="button" id="auto" class="toggle" aria-pressed="false">Auto</button>
            <button type="button" id="info" class="rail">Info</button>
          </div>
        </div>
      </footer>

      <!-- Overlays -->
      <div id="quiz-layer" class="overlay" hidden></div>
      <div id="modal-layer" class="overlay" hidden></div>
      <div id="debug-layer"></div>
      <div id="audio-controls" aria-label="Audio controls">
        <button type="button" id="sound-toggle" aria-label="Enable sound" aria-pressed="false">Sound</button>
        <details class="audio-volume">
          <summary aria-label="Sound volume" title="Sound volume">♫</summary>
          <label for="music-volume">Sound volume <input id="music-volume" type="range" min="0" max="100" step="5" value="30" /></label>
        </details>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
